name: Gradle CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore: [ "**.md", "schemas/**", ".editorconfig", ".gitignore", ".gitattributes" ]
  pull_request:
    branches: [ main, master ]
    paths-ignore: [ "**.md", "schemas/**", ".editorconfig", ".gitignore", ".gitattributes" ]

jobs:
  gradle:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu", "windows", "macos" ]
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Gradle Dependencies Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ matrix.os }}-gradle-caches-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties') }}


      - name: Setup Gradle Wrapper Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ matrix.os }}-gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Setup Gradle Wrapper Cache
        uses: actions/cache@v4
        with:
          path: ./it
          key: minosoft-assets

      - name: Build
        run: './gradlew assemble "-Pminosoft.updates=true"'

      - name: Unit test
        # Do not run compiler workers alongside the timed telemetry A/B test.
        run: './gradlew test --max-workers=1 --no-parallel'

      - name: Install Mesa Iris acceptance dependencies
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgl1-mesa-dri \
            libglx-mesa0 \
            mesa-utils \
            xauth \
            xvfb

      - name: Iris OpenGL 4.3 production gate
        if: matrix.os == 'ubuntu'
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
          MINOSOFT_OPENGL_IRIS_COMPUTE_TEST: "true"
          MINOSOFT_OPENGL_IRIS_COMPUTE_REQUIRE_CAPABILITIES: "true"
          MINOSOFT_IRIS_TEST_NON_MAC: "true"
          MINOSOFT_IRIS_TEST_OPTIONS: "WORLD_SPACE_REFLECTIONS=1;COLORED_LIGHTING=128"
        run: |
          shader_pack="${RUNNER_TEMP}/ComplementaryUnbound_r5.8.1.zip"
          curl --fail --location \
            --output "${shader_pack}" \
            "https://cdn.modrinth.com/data/R6NEzAwj/versions/VMHXIk50/ComplementaryUnbound_r5.8.1.zip"
          echo "9098dd9e0c18b80f7aba2839cea33ce9a614d97665bbfcac87ccce6e4771667c41602d99088852cb1642ccab20b2ceff9b98af8f2e795bd0d3b90b7c9cbab914  ${shader_pack}" \
            | sha512sum --check -
          export MINOSOFT_IRIS_TEST_PACK="${shader_pack}"
          xvfb-run --auto-servernum ./gradlew test -x :debug-core:test \
            --tests de.bixilon.minosoft.gui.rendering.shader.pipeline.OpenGlIrisCustomResourceComputeTest \
            --tests 'de.bixilon.minosoft.gui.rendering.shader.pipeline.IrisShaderPackPlannerTest.external shader pack crosses the complete planner contract when configured'

      - name: Integration test
        run: './gradlew integrationTest'

      - name: Package amd64
        run: './gradlew fatJar "-Parchitecture=amd64" "-Pminosoft.updates=true"'

      - name: Upload amd64 build
        uses: actions/upload-artifact@v4
        with:
          name: 'minosoft-${{ matrix.os }}-amd64'
          path: build/libs/minosoft-fat-*-amd64-*.jar

      - name: Package aarch64
        run: './gradlew fatJar "-Parchitecture=aarch64" "-Pminosoft.updates=true"'

      - name: Upload aarch64 build
        uses: actions/upload-artifact@v4
        with:
          name: 'minosoft-${{ matrix.os }}-aarch64'
          path: build/libs/minosoft-fat-*-aarch64-*.jar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: ignore
